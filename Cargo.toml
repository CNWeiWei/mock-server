[package]
name = "mock-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# 核心 Web 框架
axum = "0.8.8"
# 异步运行时
tokio={version = "1.48.0",features = ["full"]}
# 异步文件操作与流处理工具
tokio-util = {version = "0.7.17",features = ["io"]}
futures-util = "0.3.31"

# 序列化与 YAML 解析
serde = {version = "1.0.228",features = ["derive"]}
serde_yaml = "0.9.34+deprecated"
serde_json = "1.0.147"

# 物理目录递归扫描工具
#walkdir = "2.5.0"

# 性能优化：快速哈希（可选，用于路由匹配）
#dashmap = "7.0.0-rc2"
# 热加载支持（扩展功能）
#notify = "8.2.0"
# 路径处理
#pathdiff = "0.2.3"